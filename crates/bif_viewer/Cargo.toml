[package]
name = "bif_viewer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "bif_viewer"

[features]
default = []
oiio = ["bif_core/oiio", "bif_viewport/oiio"]
oidn = ["bif_viewport/oidn"]

[dependencies]
# Phase F: bif_viewer is now a thin shim over `bif_qt::run()`. The
# winit / wgpu / egui-bridge dependencies that powered the old event
# loop are gone — pulled transitively through `bif_qt` only where
# needed. `bif_core` / `bif_viewport` stay so feature flag passthrough
# (`oiio`, `oidn`) still routes correctly.
bif_qt = { path = "../bif_qt" }
bif_core = { path = "../bif_core" }
bif_viewport = { path = "../bif_viewport" }
