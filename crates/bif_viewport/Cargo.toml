[package]
name = "bif_viewport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
oiio = ["bif_core/oiio"]
oidn = ["bif_renderer/oidn"]

[dependencies]
bif_math = { path = "../bif_math" }
bif_core = { path = "../bif_core" }
bif_renderer = { path = "../bif_renderer" }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
half = "2.4"
pollster = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
tobj = "4.0"

# UI — egui kept (dead in-tree panels still depend on it; revisit when
# Qt replacements land). egui-wgpu/egui-winit dropped with Phase F egui
# bridge deletion; nothing in this crate consumes them now.
egui = { workspace = true }
egui-snarl = { version = "0.5", features = ["serde"] }
rfd = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1"
