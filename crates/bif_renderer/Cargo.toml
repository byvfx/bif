[package]
name = "bif_renderer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CPU path tracing renderer for BIF"

[features]
default = ["embree", "bif-core"]
embree = []
bif-core = ["dep:bif_core"]
oidn = ["dep:oidn"]

[dependencies]
bif_core = { path = "../bif_core", optional = true }
bif_math = { path = "../bif_math" }
glam.workspace = true
serde = { workspace = true }
rand = "0.8"
rayon = "1.10"
image = "0.24"
log.workspace = true
exr = "1.72"
half = "2.4"
thiserror.workspace = true
oidn = { version = "2.3", optional = true }
bytemuck = "1"

[[example]]
name = "simple_render"
required-features = ["embree"]

[[example]]
name = "cache_bench"
required-features = ["embree"]
