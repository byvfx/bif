[book]
title = "BIF - VFX Scene Assembler"
authors = ["byvfx"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/byvfx/bif"
edit-url-template = "https://github.com/byvfx/bif/edit/main/{path}"

[output.html.search]
enable = true
