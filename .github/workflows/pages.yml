name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'devlog/**'
      - 'docs/**'
      - 'site/**'
      - 'scripts/generate-site.sh'
      - 'assets/stitch_bif_ui/**'
      - 'assets/stitch_bif_ui_01/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'MILESTONES.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/

      - name: Generate site content
        run: bash scripts/generate-site.sh

      - name: Build book
        run: mdbook build site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/book/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
