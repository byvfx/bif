name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -p bif_math -p bif_renderer -p bif_viewport -- -D warnings

      - name: Test bif_math
        run: cargo test -p bif_math

  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Format
        run: cargo fmt --check

      - name: Clippy (no-USD crates)
        run: cargo clippy -p bif_math -p bif_renderer --no-default-features -- -D warnings

      - name: Test bif_math
        run: cargo test -p bif_math

      - name: Test bif_renderer (no Embree)
        run: cargo test -p bif_renderer --no-default-features

  release:
    name: Release
    runs-on: windows-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      # vcpkg binary caching via GitHub Actions cache: builds USD/OIIO from
      # source ONCE, then reuses binaries on later runs (saves 40-90min).
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-v2-
            ${{ runner.os }}-cargo-v2-

      # x-gha binary source provider needs these runtime vars exported.
      - name: Export GitHub Actions cache env (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "d015e31e90838a4c9dfa3eed45979bc70d9357fc"  # vcpkg 2026.05.25
          runVcpkgInstall: false

      # Classic-mode install into $VCPKG_ROOT/installed (NOT manifest mode,
      # which lands in a GUID dir). build.rs, the bridge CMakes, and the
      # Package step all assume this classic layout. Run from a manifest-free
      # CWD so vcpkg doesn't auto-detect the repo vcpkg.json. x-gha binary
      # cache still applies, so prebuilt usd/OIIO are reused.
      - name: Install vcpkg deps (classic)
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            openimageio usd "embree[geometry-triangle,geometry-instance]" zlib `
            --triplet x64-windows `
            --x-install-root="$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          # Sanity: list installed import libs (helps diagnose LNK1181 misses).
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\lib\*.lib" |
            Select-Object -ExpandProperty Name | Sort-Object
          Pop-Location

      - name: Download OIDN SDK
        shell: pwsh
        run: |
          $oidnVersion = "2.4.1"
          $oidnUrl = "https://github.com/RenderKit/oidn/releases/download/v${oidnVersion}/oidn-${oidnVersion}.x64.windows.zip"
          $oidnZip = "$env:RUNNER_TEMP\oidn.zip"
          $oidnDir = "$env:RUNNER_TEMP\oidn-${oidnVersion}.x64.windows"
          Invoke-WebRequest -Uri $oidnUrl -OutFile $oidnZip
          Expand-Archive -Path $oidnZip -DestinationPath $env:RUNNER_TEMP
          echo "OIDN_DIR=$oidnDir" >> $env:GITHUB_ENV
          echo "$oidnDir\bin" >> $env:GITHUB_PATH

      - name: Set env
        shell: pwsh
        run: |
          $vcpkgBin = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          echo "$vcpkgBin" >> $env:GITHUB_PATH

      - name: Build release
        run: cargo build --release -p bif_viewer --features oiio,oidn

      - name: Package
        shell: pwsh
        run: |
          $staging = "$env:RUNNER_TEMP\bif-release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Copy main binary
          Copy-Item "target\release\bif_viewer.exe" $staging

          # Bundle Qt runtime DLLs + platform plugins (windeployqt is on PATH
          # via install-qt-action). Deploys next to the staged exe.
          windeployqt --release --no-translations --no-compiler-runtime "$staging\bif_viewer.exe"

          # Copy ALL vcpkg runtime DLLs (USD, OIIO + its transitive deps,
          # Embree, TBB, OpenColorIO, tiff/jpeg/png/z/zstd, ...). Bulk-copy
          # avoids the hand-picked-list trap that dropped embree4.dll and
          # OIIO's image-codec deps.
          $vcpkgBin = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem "$vcpkgBin\*.dll" | Copy-Item -Destination $staging
          }

          # Copy OIDN DLLs
          $oidnBin = "$env:OIDN_DIR\bin"
          if (Test-Path $oidnBin) {
            Get-ChildItem "$oidnBin\OpenImageDenoise*.dll" | Copy-Item -Destination $staging
            # tbb12.dll from OIDN (skip if already copied)
            Get-ChildItem "$oidnBin\tbb12.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              if (-not (Test-Path "$staging\tbb12.dll")) {
                Copy-Item $_.FullName -Destination $staging
              }
            }
          }

          Compress-Archive -Path "$staging\*" -DestinationPath "bif-windows-x64.zip"

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw
          # Extract section for this version, or Unreleased if not found
          if ($changelog -match "(?s)## \[$version\][^\n]*\n(.*?)(?=\n## \[|$)") {
            $body = $Matches[1].Trim()
          } elseif ($changelog -match "(?s)## \[Unreleased\]\s*\n(.*?)(?=\n## \[|$)") {
            $body = $Matches[1].Trim()
          } else {
            $body = "Release $tag"
          }
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: bif-windows-x64.zip
